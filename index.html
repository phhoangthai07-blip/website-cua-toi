<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website của tôi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .window {
            width: 90%;
            max-width: 1100px;
            min-height: 650px;
            margin: 60px auto;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        .topbar {
            height: 55px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #ddd;
            background: rgba(255,255,255,0.7);
        }

        .dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ccc;
        }

        .content {
            padding: 80px 50px;
            text-align: center;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #666;
        }

        button {
            margin-top: 30px;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: #0071e3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0077ed;
        }
    </style>
</head>

<body>

    <div class="window">

        <div class="topbar">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="content">
            <h1>Xin chào 👋</h1>

            <p>
                Đây là website đầu tiên của tôi.
            </p>

            <button onclick="alert('Bạn vừa bấm nút!')">
                Bấm vào đây
            </button>
        </div>

    </div>

</body>
</html>
