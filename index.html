function getRank(xp) {

    let rank = AOV_RANKS[0];

    for (const r of AOV_RANKS) {

        if (xp >= r.xp) {
            rank = r;
        }

    }

    return rank;
}

/* =========================================================
   TẠO TÀI KHOẢN ẨN DANH
   ========================================================= */

async function loginPlayer(name) {

    name = name.trim();

    if (!name) {

        document.getElementById("aovLoginError").textContent =
            "⚠️ Bạn chưa nhập tên.";

        return;

    }

    if (name.length < 2) {

        document.getElementById("aovLoginError").textContent =
            "⚠️ Tên phải có ít nhất 2 ký tự.";

        return;

    }


    try {

        await signInAnonymously(auth);

        currentUser = auth.currentUser;

        currentPlayerName = name;


        /*
         * Lưu tên vào trình duyệt
         */

        localStorage.setItem(
            "ht_aov_player_name",
            name
        );


        /*
         * Lấy XP hiện tại
         */

        const xp =
            Number(
                localStorage.getItem("ht_aov_xp") || 0
            );


        /*
         * Lưu người chơi lên Firestore
         */

        await savePlayerToLeaderboard(
            name,
            xp
        );


        /*
         * Đóng màn hình đăng nhập
         */

        document.getElementById(
            "aovLoginOverlay"
        ).style.display = "none";


        updatePlayerUI();

        loadLeaderboard();

    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "aovLoginError"
        ).textContent =
            "Không thể kết nối máy chủ.";

    }

}

   ========================================================= */

            document.getElementById(
                "aovNameInput"
            ).value;

        loginPlayer(name);

    });


document

    .addEventListener("keydown", event => {

        if (event.key === "Enter") {

            document
                .getElementById("aovLoginButton")
                .click();

        }

    });


/* =========================================================
   TỰ ĐĂNG NHẬP LẠI
   ========================================================= */

const oldName =
    localStorage.getItem(
        "ht_aov_player_name"
    );

if (oldName) {

    document
        .getElementById("aovNameInput")
        .value = oldName;

    loginPlayer(oldName);

}


/* =========================================================
   LƯU NGƯỜI CHƠI
   ========================================================= */

async function savePlayerToLeaderboard(
    name,
    xp
) {

    if (!currentUser) return;


    const rank =
        getRank(xp);


    await setDoc(

        doc(
            db,
            "players",
            currentUser.uid
        ),

        {

            name: name,

            xp: xp,

            rank: rank.name,

            updatedAt:
                Date.now()

        },

        {
            merge:true
        }

    );

}


/* =========================================================
   CẬP NHẬT XP LÊN BXH
   ========================================================= */

window.updateAOVLeaderboard = async function() {

    if (!currentUser) return;


    const xp =
        Number(
            localStorage.getItem(
                "ht_aov_xp"
            ) || 0
        );


    await savePlayerToLeaderboard(
        currentPlayerName,
        xp
    );


    loadLeaderboard();

};


/* =========================================================
   TỰ CẬP NHẬT BXH MỖI KHI XP THAY ĐỔI
   ========================================================= */

let lastXP = -1;

setInterval(() => {

    const xp =
        Number(
            localStorage.getItem(
                "ht_aov_xp"
            ) || 0
        );


    if (xp !== lastXP) {

        lastXP = xp;

        updateAOVLeaderboard();

    }

}, 1500);

/* =========================================================
   TẢI BẢNG XẾP HẠNG
   ========================================================= */

async function loadLeaderboard() {

    const container =
        document.getElementById(
            "aovLeaderboard"
        );


    if (!container) return;


    try {

        const playersRef =
            collection(
                db,
                "players"
            );


        const q =
            query(
                playersRef,
                orderBy(
                    "xp",
                    "desc"
                ),
                limit(100)
            );


        const snapshot =
            await getDocs(q);


        if (snapshot.empty) {

            container.innerHTML = `

                <div class="aovLoading">

                    Chưa có người chơi nào.

                </div>

            `;

            return;

        }


        let html = "";

        let position = 1;


        snapshot.forEach(playerDoc => {

            const player =
                playerDoc.data();


            const rank =
                getRank(
                    Number(
                        player.xp || 0
                    )
                );


            const isMe =
                currentUser &&
                playerDoc.id ===
                currentUser.uid;


            let medal = position;


            if (position === 1)
                medal = "🥇";

            else if (position === 2)
                medal = "🥈";

            else if (position === 3)
                medal = "🥉";


            html += `

                <div class="
                    aovPlayer
                    ${isMe ? "aovYou" : ""}
                ">

                    <div class="aovPosition">

                        ${medal}

                    </div>


                    <div class="aovPlayerName">

                        <span class="aovRankIcon">
                            ${rank.icon}
                        </span>

                        ${escapeHTML(
                            player.name ||
                            "Người chơi"
                        )}

                        ${
                            isMe
                            ? " <small>(Bạn)</small>"
                            : ""
                        }

                    </div>


                    <div class="aovPlayerXP">

                        ⭐ ${Number(
                            player.xp || 0
                        ).toLocaleString()} XP

                    </div>


                    <div class="aovPlayerRank">

                        ${rank.icon}
                        ${rank.name}

                    </div>

                </div>

            `;


            position++;

        });


        container.innerHTML = html;

    }

    catch(error) {

        console.error(error);

        container.innerHTML = `

            <div class="aovLoading">

                ⚠️ Chưa thể tải bảng xếp hạng.

            </div>

        `;

    }

}

function updatePlayerUI() {

    /*
     * Tìm các phần tử có class này nếu bạn muốn
     * hiển thị tên người chơi ở header.
     */

    document
        .querySelectorAll(
            ".aov-current-player"
        )
        .forEach(el => {

            el.textContent =
                currentPlayerName;

        });

}


/* =========================================================
   BẢO VỆ HTML
   ========================================================= */

function escapeHTML(text) {

    return String(text)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}
